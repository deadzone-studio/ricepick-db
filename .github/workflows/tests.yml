name: tests

on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", ".github/workflows/tests.yml"]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the same checks the bot uses
        run: pip install "ricepick @ git+https://github.com/deadzone-studio/ricepick@v0.1.1"
      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v
